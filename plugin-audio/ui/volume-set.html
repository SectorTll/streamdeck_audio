<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Audio Keys – Volume Set</title>
  <script src="sdpi-components.js"></script>
</head>
<body>

  <sdpi-item label="Target, %">
    <sdpi-range setting="target" min="0" max="100" step="5" default="0" showlabels></sdpi-range>
  </sdpi-item>

  <sdpi-item label="Fade, ms">
    <sdpi-range setting="fadeMs" min="0" max="5000" step="100" default="1000" showlabels></sdpi-range>
  </sdpi-item>

  <sdpi-item label="LED: level">
    <sdpi-color setting="colorLed" default="#3ce650"></sdpi-color>
  </sdpi-item>

  <sdpi-item label="LED: muted">
    <sdpi-color setting="colorMuted" default="#ff3b30"></sdpi-color>
  </sdpi-item>

  <sdpi-item label="Options">
    <sdpi-checkbox setting="showPercent" default="true" label="Show volume percent on the key"></sdpi-checkbox>
  </sdpi-item>

</body>
</html>
