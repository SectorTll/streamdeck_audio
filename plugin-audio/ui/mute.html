<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Audio Keys – Mute</title>
  <script src="sdpi-components.js"></script>
</head>
<body>

  <sdpi-item label="LED: muted">
    <sdpi-color setting="colorMuted" default="#ff3b30"></sdpi-color>
  </sdpi-item>

  <sdpi-item label="LED: sound on">
    <sdpi-color setting="colorLed" default="#3ce650"></sdpi-color>
  </sdpi-item>

  <sdpi-item label="Options">
    <sdpi-checkbox setting="showPercent" default="false" label="Show volume percent on the key"></sdpi-checkbox>
  </sdpi-item>

</body>
</html>
